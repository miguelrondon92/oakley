[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oakley"
version = "0.1.0"
description = "AI assistant for local HOA and county regulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "google-generativeai>=0.8",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
oakley = "oakley.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call Gemini API (require GEMINI_API_KEY)",
]
testpaths = ["tests"]
